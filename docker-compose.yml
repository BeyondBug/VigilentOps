networks:
  sg-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.18.0.0/16
          gateway: 172.18.0.1

volumes:
  postgres_data:
  redis_data:
  gitea_data:
  jenkins_data:
  grafana_data:
  falco-socket:
  wazuh_data:
  wazuh_alerts:
  wazuh_api_config:

services:

  # The only published application port. Optional upstreams resolve at runtime.
  gateway:
    image: nginx:1.28-alpine
    container_name: sg-gateway
    ports:
      - "${GATEWAY_BIND_ADDRESS:-0.0.0.0}:3000:3000"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./secrets/gateway/fullchain.pem:/etc/nginx/tls/fullchain.pem:ro
      - ./secrets/gateway/server-key.pem:/etc/nginx/tls/server-key.pem:ro
      - ./secrets/gateway/htpasswd:/etc/nginx/auth/htpasswd:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW
    depends_on:
      - gitea
      - dashboard
    networks:
      - sg-net
    restart: unless-stopped

  # ── Gitea (self-hosted Git) ──────────────────────────────
  gitea:
    image: gitea/gitea:1.27.3
    container_name: sg-gitea
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__database__DB_TYPE=postgres
      - GITEA__database__HOST=postgres:5432
      - GITEA__database__NAME=${GITEA_DB_NAME:-secureguard}
      - GITEA__database__USER=${POSTGRES_USER}
      - GITEA__database__PASSWD=${POSTGRES_PASSWORD}
      - GITEA__webhook__ALLOWED_HOST_LIST=172.18.0.100
      - GITEA__server__ROOT_URL=${PUBLIC_URL:-https://localhost:3000}/
      - GITEA__server__LOCAL_ROOT_URL=http://sg-gitea:3000/
      - GITEA__server__DISABLE_SSH=true
    volumes:
      - gitea_data:/data
    depends_on:
      - postgres
    networks:
      - sg-net
    restart: unless-stopped

  gitea-runner:
    image: gitea/act_runner:0.6.1
    container_name: gitea-runner
    environment:
      - GITEA_INSTANCE_URL=http://gitea:3000
      - GITEA_RUNNER_REGISTRATION_TOKEN=${GITEA_RUNNER_REGISTRATION_TOKEN:-}
      - GITEA_RUNNER_NAME=local-runner
      - GITEA_RUNNER_LABELS=ubuntu-latest:docker
    volumes:
      - ./runner_data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - sg-net
    restart: unless-stopped
    depends_on:
      - gitea
    profiles:
      - actions

  # ── PostgreSQL ───────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: sg-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - sg-net
    restart: unless-stopped

  # ── Redis (job queue) ────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: sg-redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - sg-net
    restart: unless-stopped

  migrate:
    build: ./ai-engine
    env_file: ${ENV_FILE:-.env}
    command: python migrate.py
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sg-net
    restart: "no"

  # ── FastAPI orchestrator ─────────────────────────────────
  orchestrator:
    build: ./ai-engine
    container_name: sg-orchestrator
    env_file: ${ENV_FILE:-.env}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      gitea:
        condition: service_started
    volumes:
      - ./ai-engine:/app
    networks:
      - sg-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    command: uvicorn main:app --host 0.0.0.0 --port 8000

  # ── Celery worker ────────────────────────────────────────
  celery-worker:
    build: ./ai-engine
    container_name: sg-celery
    # The shared image's HTTP probe applies only to the API process.
    healthcheck:
      disable: true
    env_file: ${ENV_FILE:-.env}
    environment:
      - PUSHGATEWAY_URL=http://sg-pushgateway:9091
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      sg-pushgateway:
        condition: service_started
    volumes:
      - ./ai-engine:/app
    networks:
      - sg-net
    restart: unless-stopped
    command: celery -A tasks worker --loglevel=info --concurrency=${AI_WORKER_CONCURRENCY:-1}

  # ── CVE Intel poller ─────────────────────────────────────
  cve-intel:
    build: ./cve-intel
    container_name: sg-cve-intel
    env_file: ${ENV_FILE:-.env}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - ./cve-intel:/app
    networks:
      - sg-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  cve-worker:
    build: ./cve-intel
    container_name: sg-cve-worker
    healthcheck:
      disable: true
    env_file: ${ENV_FILE:-.env}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - ./cve-intel:/app
    networks:
      - sg-net
    restart: unless-stopped
    command: celery -A tasks worker --loglevel=info --concurrency=1 -Q cve_enrichment

  # ── Jenkins ──────────────────────────────────────────────
  jenkins:
    build:
      context: ./jenkins
      dockerfile: Dockerfile
    container_name: sg-jenkins
    user: root
    volumes:
      - jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ./jenkins/pipelines:/var/jenkins_home/pipelines
      - ./jenkins/init.groovy.d/zz-secureguard-security.groovy:/var/jenkins_home/init.groovy.d/zz-secureguard-security.groovy:ro
      - ./secrets/jenkins:/run/secureguard-jenkins:ro
    environment:
      - SG_API_KEY=${SG_API_KEY}
      - SNYK_TOKEN=${SNYK_TOKEN:-}
      - NVD_API_KEY=${NVD_API_KEY:-}
      - NVD_DATAFEED_URL=${NVD_DATAFEED_URL:-}
      - SCANNER_DNS=${SCANNER_DNS:-}
      - JENKINS_HOME_HOST=${JENKINS_HOME_HOST:-}
      - JENKINS_OPTS=--prefix=/jenkins
      - GITEA_PUBLIC_URL=${PUBLIC_URL:-https://localhost:3000}
    networks:
      sg-net:
        ipv4_address: 172.18.0.100
    restart: unless-stopped
    profiles: [ci]

  # ── React dashboard ──────────────────────────────────────
  dashboard:
    build: ./dashboard
    container_name: sg-dashboard
    env_file: ${ENV_FILE:-.env}
    depends_on:
      orchestrator:
        condition: service_healthy
      cve-intel:
        condition: service_healthy
    networks:
      - sg-net
    restart: unless-stopped

  # ── Prometheus ───────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v3.8.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.external-url=${PUBLIC_URL:-https://localhost:3000}/prometheus/"
      - "--web.route-prefix=/"
    container_name: sg-prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./secrets/jenkins/metrics-password:/etc/prometheus/jenkins-metrics-password:ro
    depends_on:
      - sg-pushgateway
    networks:
      - sg-net
    restart: unless-stopped
    profiles: [monitoring]

  # ── Pushgateway (metrics bridge for Celery workers) ──────
  sg-pushgateway:
    image: prom/pushgateway:v1.11.3
    container_name: sg-pushgateway
    networks:
      - sg-net
    restart: unless-stopped

  # ── Grafana ──────────────────────────────────────────────
  grafana:
    image: grafana/grafana:13.2.2
    container_name: sg-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_SERVER_ROOT_URL=${PUBLIC_URL:-https://localhost:3000}/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      # Install Infinity datasource plugin on every startup
      - GF_PLUGINS_PREINSTALL=yesoreyeram-infinity-datasource
      # Allow the plugin to make outbound requests to internal services
      - GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS=yesoreyeram-infinity-datasource
      # Allow Infinity to reach internal Docker network URLs
      - GF_SECURITY_ANGULAR_SUPPORT_ENABLED=true
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    networks:
      - sg-net
    restart: unless-stopped
    profiles: [monitoring]

  # ── Falco (kernel syscall + container runtime monitoring) ──
  falco:
    image: falcosecurity/falco:0.43.0
    container_name: sg-falco
    privileged: true
    security_opt:
      - apparmor:unconfined
      - seccomp:unconfined
    pid: host
    environment:
      - SKIP_DRIVER_LOADER=true
      - FALCO_GRPC_ENABLED=true
      - FALCO_GRPC_BIND_ADDRESS=unix:///var/run/falco/falco.sock
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - /proc:/host/proc:ro
      - /sys/kernel/btf/vmlinux:/sys/kernel/btf/vmlinux:ro
      - /sys/kernel/debug:/sys/kernel/debug:ro
      - ./monitoring/falco/falco.yaml:/etc/falco/falco.yaml:ro
      - ./monitoring/falco/rules:/etc/falco/rules.d:ro
      - falco-socket:/var/run/falco
    networks:
      - sg-net
    restart: unless-stopped
    profiles: [monitoring]

  # ── PostgreSQL exporter ──────────────────────────────────
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: sg-postgres-exporter
    environment:
      - DATA_SOURCE_NAME=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@sg-postgres:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      - postgres
    networks:
      - sg-net
    restart: unless-stopped
    profiles: [monitoring]

  # ── Redis exporter ───────────────────────────────────────
  redis-exporter:
    image: oliver006/redis_exporter:v1.92.0
    container_name: sg-redis-exporter
    environment:
      - REDIS_ADDR=redis://sg-redis:6379
    depends_on:
      - redis
    networks:
      - sg-net
    restart: unless-stopped
    profiles: [monitoring]

  # ── cAdvisor (Docker container metrics) ──────────────────
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: sg-cadvisor
    privileged: true
    command:
      - "--docker_only=true"
      - "--store_container_labels=true"
      - "--housekeeping_interval=10s"
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /cgroup:/cgroup:ro
    networks:
      - sg-net
    restart: unless-stopped
    profiles: [monitoring]

  # ── Falco → Prometheus exporter ──────────────────────────
  falco-exporter:
    image: falcosecurity/falco-exporter:0.8.7
    container_name: sg-falco-exporter
    volumes:
      - falco-socket:/var/run/falco:ro
    depends_on:
      - falco
    networks:
      - sg-net
    restart: unless-stopped
    profiles: [monitoring]

  # ── Wazuh HIDS manager ───────────────────────────────────
  wazuh:
    image: wazuh/wazuh-manager:4.7.3
    container_name: sg-wazuh
    entrypoint: ["/bin/sh", "-c", "mkdir -p /var/ossec/logs/archives /var/ossec/logs/firewall && chown wazuh:wazuh /var/ossec/logs/archives /var/ossec/logs/firewall && exec /init"]
    environment:
      - WAZUH_MANAGER_IP=0.0.0.0
    volumes:
      - wazuh_data:/var/ossec/data
      - wazuh_alerts:/var/ossec/logs/alerts
      - wazuh_api_config:/var/ossec/api/configuration
      - ./monitoring/wazuh/ossec.conf:/var/ossec/etc/ossec.conf:ro
      - ./monitoring/wazuh/shared:/var/ossec/etc/shared:rw
    networks:
      - sg-net
    restart: unless-stopped
    profiles: [monitoring]

  # ── Loki (log aggregation) ───────────────────────────────
  loki:
    image: grafana/loki:2.9.0
    container_name: sg-loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - sg-net
    restart: unless-stopped
    profiles: [monitoring]

  # ── Promtail (reads Wazuh alerts and ships to Loki) ──────
  promtail:
    image: grafana/promtail:2.9.0
    container_name: sg-promtail
    volumes:
      - ./monitoring/promtail/promtail.yml:/etc/promtail/config.yml
      - wazuh_data:/var/ossec/data:ro
      - wazuh_alerts:/var/ossec/logs/alerts:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
      - wazuh
    networks:
      - sg-net
    restart: unless-stopped
    profiles: [monitoring]

  # ── Wazuh API proxy ──────────────────────────────────────
  wazuh-proxy:
    build: ./wazuh-proxy
    container_name: sg-wazuh-proxy
    environment:
      - WAZUH_URL=https://sg-wazuh:55000
      - WAZUH_USER=${WAZUH_USER:-wazuh}
      - WAZUH_PASS=${WAZUH_PASSWORD:?Set WAZUH_PASSWORD in .env}
      - WAZUH_CA_CERT=/etc/wazuh/api/ssl/server.crt
    volumes:
      - wazuh_api_config:/etc/wazuh/api:ro
    expose:
      - "8002"
    depends_on:
      - wazuh
    networks:
      - sg-net
    restart: unless-stopped
    profiles: [monitoring]
