worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    # Query strings may contain webhook tokens. Never include them in logs.
    log_format gateway '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
    access_log /dev/stdout gateway;
    error_log /dev/stderr warn;
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    map $request_uri $upstream_authorization {
        ~^/(dashboard|prometheus)/ "";
        default $http_authorization;
    }

    server {
        listen 3000 ssl;
        server_name _;
        ssl_certificate /etc/nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/server-key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:TLS:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;
        # Old HTTP bookmarks upgrade to HTTPS on this same application port.
        error_page 497 =308 https://$http_host$request_uri;
        client_max_body_size 512m;
        client_body_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port 3000;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Authorization $upstream_authorization;
        proxy_redirect off;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;

        location = /dashboard { return 308 /dashboard/; }
        location = /grafana { return 308 /grafana/; }
        location = /jenkins { return 308 /jenkins/; }
        location = /prometheus { return 308 /prometheus/; }

        location ^~ /dashboard/ {
            auth_basic "VigilentOps findings";
            auth_basic_user_file /etc/nginx/auth/htpasswd;
            # Gateway credentials are never forwarded to the application.
            set $dashboard dashboard:3000;
            rewrite ^/dashboard/(.*)$ /$1 break;
            proxy_pass http://$dashboard$uri$is_args$args;
        }

        location ^~ /jenkins/ {
            set $jenkins jenkins:8080;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_pass http://$jenkins$request_uri;
        }

        location ^~ /grafana/ {
            set $grafana grafana:3000;
            proxy_pass http://$grafana$request_uri;
        }

        location ^~ /prometheus/ {
            auth_basic "VigilentOps metrics";
            auth_basic_user_file /etc/nginx/auth/htpasswd;
            set $prometheus prometheus:9090;
            rewrite ^/prometheus/(.*)$ /$1 break;
            proxy_pass http://$prometheus$uri$is_args$args;
        }

        # Gitea keeps its existing root paths, Git smart HTTP, LFS and API.
        # Preserve the original encoded URI, including escaped repository paths.
        location / {
            set $gitea gitea:3000;
            proxy_request_buffering off;
            proxy_pass http://$gitea$request_uri;
        }
    }
}
