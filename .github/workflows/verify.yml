name: Verify

on:
  workflow_dispatch:

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: python -m pip install -r ai-engine/requirements.txt -r cve-intel/requirements.txt
      - name: Python tests
        run: python -m unittest discover -s tests -v
      - name: Shell syntax
        run: bash -n scripts/setup-kali.sh monitoring/wazuh/*.sh
      - name: Compose configuration
        run: ENV_FILE=.env.example docker compose --env-file .env.example --profile ci --profile monitoring --profile actions config -q

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm install --legacy-peer-deps
      - name: Build dashboard
        working-directory: dashboard
        run: npm run build
