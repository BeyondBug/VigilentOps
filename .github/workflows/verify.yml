name: Verify

on:
  workflow_dispatch:

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: python -m pip install -r ai-engine/requirements.txt -r cve-intel/requirements.txt
      - name: Python tests
        run: python -m unittest discover -s tests -v
      - name: Shell syntax
        run: bash -n scripts/setup-kali.sh
      - name: Compose configuration
        run: ENV_FILE=.env.example docker compose --env-file .env.example --profile ci --profile monitoring --profile actions config -q

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci --legacy-peer-deps
      - name: Build dashboard
        working-directory: dashboard
        run: npm run build
